  dimensions:
    backend: unknown
    ui: implemented
    tests: partial
  verification:
    scenarios:
    - id: headless-trigger
      description: An already-active sidebar reselect queues one correctly scoped resume and no prompt submit; the draft and visible transcript stay intact while pending.
    - id: gateway-loopback-inflight
      description: A local WebSocket gateway fixture refuses a resume, accepts the retry, streams start/delta events while the transcript snapshot is pending, and emits completion after the snapshot.
    - id: live-inflight
      description: A live in-flight turn reattaches, continues streaming once, and refreshes the transcript without losing queued or pending messages.
    - id: failure-recovery
      description: Offline, denied, stale, and reconnect outcomes preserve ownership and never submit the prompt twice.
    - id: connection-owner-isolation
      description: Same profile/session IDs on different Gateways keep separate persisted panes and resume results remain fenced to the selected connection owner.

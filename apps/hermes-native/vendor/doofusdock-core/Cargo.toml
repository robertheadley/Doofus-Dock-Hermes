[package]
name = "doofusdock-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Toolkit-independent docking model and transaction engine"
repository = "https://github.com/robertheadley/doofusdock"

[package.metadata.doofusdock-vendor]
source_revision = "f23ed02a99c7f8c57f83164d98feadb17cc4ed87"
local_changes = "Hermes group-minimize acceptance test"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
serde_repr = "0.1"
roxmltree = "0.21.2"
fs4 = { version = "1", features = ["sync"] }

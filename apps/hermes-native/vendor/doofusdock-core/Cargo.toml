[package]
name = "doofusdock-core"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Toolkit-independent docking model and transaction engine"
repository = "https://github.com/robertheadley/doofusdock"

[package.metadata.doofusdock-vendor]
source_revision = "f6eb49b9e488f4e851d8d3abe18e95d296201bba"
local_changes = "Canonical tab-group minimization and restore state"

[dependencies]
serde = { version = "1", features = [ "derive", "rc" ] }
serde_json = { version = "1", features = [ "preserve_order" ] }
serde_repr = "0.1"

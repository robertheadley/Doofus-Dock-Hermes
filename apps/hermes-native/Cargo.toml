[package]
name = "hermes-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[features]
default = []
agent-automation = ["dep:egui_kittest"]

[dependencies]
doofusdock-core = { git = "https://github.com/robertheadley/doofusdock", rev = "f23ed02a99c7f8c57f83164d98feadb17cc4ed87" }
doofusdock-host-egui = { git = "https://github.com/robertheadley/doofusdock", rev = "f23ed02a99c7f8c57f83164d98feadb17cc4ed87" }
doofusdock-presentation = { git = "https://github.com/robertheadley/doofusdock", rev = "f23ed02a99c7f8c57f83164d98feadb17cc4ed87" }
doofusdock-render-egui = { git = "https://github.com/robertheadley/doofusdock", rev = "f23ed02a99c7f8c57f83164d98feadb17cc4ed87" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"], optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
sha2 = "0.10"
tungstenite = { version = "0.30", features = ["native-tls"] }
ureq = { version = "3.5", default-features = false, features = ["json", "rustls"] }
url = "2"
zeroize = "1"
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
pulldown-cmark = "0.13.6"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
base64 = "0.23"
getrandom = "0.3"
open = "5"
resvg = { version = "0.49.0", default-features = false, features = ["raster-images", "system-fonts", "text"] }
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_8125"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
qrcodegen = "1.8.0"
ignore = "0.4.33"
portable-pty = "0.9.0"
vt100 = "0.18.1"

[target.'cfg(windows)'.dependencies]
wry = { version = "=0.57.2", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
rfd = { version = "0.17.2", default-features = false }

[[bin]]
name = "hermes-automation"
path = "src/bin/hermes-automation.rs"
required-features = ["agent-automation"]

[[bin]]
name = "html-preview-smoke"
path = "src/bin/html-preview-smoke.rs"
required-features = ["agent-automation"]

[package]
name = "hermes-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[features]
default = []
agent-automation = ["dep:egui_kittest"]

[dependencies]
doofusdock-core = { git = "https://github.com/robertheadley/doofusdock", rev = "f6eb49b9e488f4e851d8d3abe18e95d296201bba" }
doofusdock-host-egui = { git = "https://github.com/robertheadley/doofusdock", rev = "f6eb49b9e488f4e851d8d3abe18e95d296201bba" }
doofusdock-presentation = { git = "https://github.com/robertheadley/doofusdock", rev = "f6eb49b9e488f4e851d8d3abe18e95d296201bba" }
doofusdock-render-egui = { git = "https://github.com/robertheadley/doofusdock", rev = "f6eb49b9e488f4e851d8d3abe18e95d296201bba" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"], optional = true }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tungstenite = { version = "0.30", features = ["native-tls"] }
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
zeroize = "1"
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }

[[bin]]
name = "hermes-automation"
path = "src/bin/hermes-automation.rs"
required-features = ["agent-automation"]
